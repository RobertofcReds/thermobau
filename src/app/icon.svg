<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Original 128px favicon preserved byte-for-byte; only its four white corners are clipped. -->
  <defs>
    <clipPath id="rounded-corners">
      <rect width="128" height="128" rx="24" ry="24" />
    </clipPath>
  </defs>
  <image width="128" height="128" href="data:image/png;base64," clip-path="url(#rounded-corners)" />
</svg>
